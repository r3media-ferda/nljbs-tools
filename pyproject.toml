[project]
name = "nljbs-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pyyaml", "static-ffmpeg", "soundfile", "sherpa-onnx", "pillow", "opencv-python-headless"]

[project.scripts]
nljbs = "nljbs.cli:main"
palefire = "palefire.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nljbs", "palefire"]
