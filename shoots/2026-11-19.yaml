                  [AVE10315,   2.5, 2.2, 1.4]]}]   #   another table marking cards; back to the host for "we play Singo!"
      - [AVE10314, 162.0, 163.2, action]    # woman at her table with a beer (ends before the camera moves)
      - [AVE10313,  40.85,  45.98, talk,    # Round one is a single row of five. So if you hear the song and you know it, mark it down.
         {broll: [[AVE10314,  52.0, 3.3, 9.0]]}]   #   marker on a card, held to the end of the line (Avery v3)
      - [AVE10367,  28.21,  31.01, punch]   # Okay, we're gonna see if we have our first Singo of the night.   (payoff)
