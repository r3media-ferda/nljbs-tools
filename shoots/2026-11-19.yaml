      - [AVE10367,  33.55,  33.90, talk]    # Congratulations!
      - [AVE10319,   0.00,   1.60, action]  # bartender shaking (ends before the blur)
      - [AVE10377,  19.50,  22.00, react]   # second winner celebrating with the host (gift-card talk muted)
      - [AVE10377,  35.38,  41.70, talk,    # (opens at 35.28 s, past 3 blurred frames) Round three is the blackout round. That means you want to fill every square, top to bottom, side to side.
         {start: 35.28, broll: [[AVE10314, 150.5, 3.0, 1.5],      #   card with an X on "fill every square"
                  [AVE10314, 127.0, 4.5, 1.5]]}]   #   card on "top to bottom, side to side"
