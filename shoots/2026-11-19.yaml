    payoff: 4                         # "first Singo of the night" lands on the track's break
    break_at: 33.0
    title_card: {text: SINGO THURSDAYS, until: 2}
    # v3 (Avery, 2026-11-21): flash frames out (12-frame minimum), words end where the voice stops, sharp b-roll only,
