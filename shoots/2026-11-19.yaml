# Pale Fire Basye, Nov 19 2026: Singo (music bingo) night. Built by `palefire cut shoots/2026-11-19.yaml [--preview]`.
# v1 (2026-11-21). Ends on "let's do it"; the "Come on!" shot swung off her. Host's own lines only; Avery's off-camera "give me a big old come on?" and the flubbed closing line are out.
#
# Segments: [clip stem, a, b, kind, (scale % or {scale, end})]. kinds: talk, punch (115%), action (no dialogue),
# react (picture only, camera audio muted), end. The bar's bingo songs play under everything on camera audio.

shoot: "/Volumes/Extreme SSD/R3 Media/PALE FIRE/2026/NOVEMBER/November 19th BAYSE "
work: ~/r3-work/palefire/november_november_19th_bayse
# Shot vertical with no rotation tag: every clip turns 90 degrees counter-clockwise.
rotate: -90
# AVE10313-10320 are 1080p Canon Log 3 (10-bit); AVE10367-10377 are 4K standard color and take no cube.
lut: luts/nljbs/SHOPTALK_AVE_CanonLog3_BT709.cube
clip_lut: {AVE10367: none, AVE10370: none, AVE10372: none, AVE10377: none}
finish: "null"
template_xml: /Volumes/Extreme SSD/R3 Media/PALE FIRE/2026/VIDEO AUTOMATION /STIENHOLDING.xml
music_db: {talk: -20, punch: -20, action: -8, react: -8, end: -10}
snap_window: 0.30

# The recognizer hears "Singo" as "single"; "a single row of five" is the real word, so fix phrases only.
# "in May 6" is "at Basye" (CHECK with Avery).
fix:
  palefire: Pale Fire
  pailfire: Pale Fire
  in may 6: at Basye
  we play single: we play Singo
  first single: first Singo
  bayzy: Basye
  palefire single: Pale Fire Singo
  come down to: Come down to

