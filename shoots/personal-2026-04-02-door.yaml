# Personal vlog, Apr 2 2026: Home Depot run and painting the R3 studio door. Built by `palefire cut <this> [--preview]`.
# v2 (Avery, 2026-11-24): office cut between Avery and Jordan (mostly Avery, slow push on Jordan), every wide shot
# cropped on the faces, more Home Depot banter, longer "welcome to America", shorter drive, Oz's closer whole.
# v1 (2026-11-24). Canon 4K horizontal plus two iPhone clips, cropped to 9:16.
# Most lines are Avery narrating from behind the camera, so they carry `vo: true` (skips the face-in-frame check only).
# The drive clips have the car stereo playing, so they go in as `react` (camera audio muted).
#
# Segments: [clip stem, a, b, kind, (scale % or {options})]. kinds: talk, punch (115%), action, react, end.
# Wide shots crop on the biggest face automatically; `x: 0-1` pins the crop centre by hand. `zoom: [from, to]` is a slow push.

shoot: /Users/averyleavitt/r3-work/personal/painting_door_day/shoot   # "RAW VIDEO" in here links to the SSD folder (read only)
work: ~/r3-work/personal/painting_door_day
lut: none          # standard color, 8-bit: no cube
finish: "null"
template_xml: /Volumes/Extreme SSD/R3 Media/PALE FIRE/2026/VIDEO AUTOMATION /STIENHOLDING.xml
music_db: {talk: -20, punch: -20, action: -10, react: -8, end: -10}
