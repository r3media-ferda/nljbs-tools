      - [093A2166, 26.45, 32.01, talk, {vo: true}]                   # Okay, so list will appear somewhere right here: extension cords, paint,
      - [093A2166, 33.25, 39.79, punch, {vo: true}]                   # drop towel, drop cloth, and more. I don't know. We're gonna figure it out.
      - [093A2168,  0.8,  2.6, action]                      # walking the aisles
      - [093A2167,  2.16,  8.35, talk, {vo: true}]          # What do you mean I have no reason to own a power tool? I want it. But I want it though.
      - [093A2169,  2.48,  9.45, talk, {vo: true,           # Drop cloth found. Copper hammered, black hammered, or silver hammered?
