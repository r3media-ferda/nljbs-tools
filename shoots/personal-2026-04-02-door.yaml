      - [093A2169, 13.04, 15.38, punch, {vo: true}]         # I think I'm just getting hammered in general.
      - [093A2172,  2.48,  4.55, talk, {vo: true}]          # You can make like the Campbell soup for me.   (chalkboard can in the cart)
      - [093A2175, 41.02, 44.89, talk]                      # I feel like it makes people uncomfortable. But when you have a cameraman like myself.
      - [093A2175, 44.94, 49.62, punch, {vo: true, end: 49.9}]  # But when you have a sexy. Little guy who follows you around. Who are you calling little guy?
      - [093A2177,  2.08,  8.53, talk, {vo: true}]          # Welcome to America. Where are we? You could never know. We could be anywhere in America. And you'd have no idea.
      - [093A2177,  9.84, 16.19, punch, {vo: true}]         # There's a Ford F1 Ram 2500 and a Tesla, you know? Tessie for my bestie.
      - [093A2183, 42.0, 42.8, react]                       # drive back
