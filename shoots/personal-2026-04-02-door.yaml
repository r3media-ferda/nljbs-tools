      - [093A2149, 305.09, 310.03, talk, {vo: true}]        # You do like a time lapse. I'll just clap and it'll be done, right? That's what good content creators would do.
      - [093A2149, 313.17, 316.25, punch, {vo: true}]       # There you go. See me in six hours, I guess.
